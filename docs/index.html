<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow, noarchive"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauty &amp; Spas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>img:fullscreen{object-fit:contain;background:#000}</style></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark mb-4"><div class="container"><a class="navbar-brand" href="https://digital-brand-site-templates.github.io/">Digital Brand Site Templates</a></div></nav><main class="container pb-5"><h1 class="h3 mb-4">Beauty &amp; Spas</h1><div class="row row-cols-1 row-cols-md-3 g-4"><div class="col"><div class="card h-100 shadow-sm"><img id="img-beaut-ica" src="images/beaut-ica.png" class="card-img-top" alt="Beaut-ica preview" loading="lazy"><div class="card-body d-flex justify-content-between align-items-center"><h5 class="card-title mb-0">Beaut-ica</h5><div><button class="btn btn-primary btn-sm fs-btn" data-target="img-beaut-ica" data-name="Beaut-ica">Full screen</button><a class="btn btn-outline-secondary btn-sm ms-1" href="demo/beaut-ica/" target="_blank">Live demo</a></div></div></div></div><div class="col"><div class="card h-100 shadow-sm"><img id="img-beauti-licious" src="images/beauti-licious.png" class="card-img-top" alt="Beauti-licious preview" loading="lazy"><div class="card-body d-flex justify-content-between align-items-center"><h5 class="card-title mb-0">Beauti-licious</h5><div><button class="btn btn-primary btn-sm fs-btn" data-target="img-beauti-licious" data-name="Beauti-licious">Full screen</button><a class="btn btn-outline-secondary btn-sm ms-1" href="demo/beauti-licious/" target="_blank">Live demo</a></div></div></div></div><div class="col"><div class="card h-100 shadow-sm"><img id="img-space-lon" src="images/space-lon.png" class="card-img-top" alt="Space-lon preview" loading="lazy"><div class="card-body d-flex justif
